services:
  delivery:
    build:
      context: .
      dockerfile: crews/delivery/Dockerfile
    image: crew-delivery:local
    ports:
      - '3000:3000'
    env_file:
      - crews/delivery/.env
    volumes:
      - delivery-data:/data
    restart: unless-stopped
    healthcheck:
      test: >
        node -e "fetch('http://localhost:3000/healthz')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  delivery-data:
